<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select College | Campus Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Animated dreamy background */
        .animated-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(45deg, #c3dafe, #e0f2fe, #dbeafe, #e0e7ff, #c7d2fe);
            background-size: 300% 300%;
            animation: gradientBreathe 18s ease infinite;
            z-index: -2;
        }

        @keyframes gradientBreathe {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating orbs */
        .floating-orbs::before,
        .floating-orbs::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(2px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            animation: float 22s infinite ease-in-out;
            z-index: -1;
        }

        .floating-orbs::before {
            width: 320px;
            height: 320px;
            top: -10%;
            left: -15%;
            animation-delay: 0s;
        }

        .floating-orbs::after {
            width: 420px;
            height: 420px;
            bottom: -20%;
            right: -20%;
            animation-delay: 8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(80px, 60px) rotate(12deg); }
            50% { transform: translate(-40px, 120px) rotate(-8deg); }
            75% { transform: translate(60px, -80px) rotate(15deg); }
        }

        /* Glassmorphism card & navbar */
        .glass {
            background: rgba(255, 255, 255, 0.68);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .glass:hover {
            box-shadow: 0 15px 60px rgba(59, 130, 246, 0.2);
        }

        /* Navbar hover scale + underline */
        .nav-link {
            position: relative;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            transform: translateY(-2px);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: linear-gradient(to right, #3b82f6, #6366f1);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Floating logo */
        .logo-float {
            animation: logoFloat 7s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }

        /* Button shine */
        .btn-shine {
            background-size: 200% 200%;
            animation: shine 5s ease infinite;
        }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <div class="animated-bg"></div>
    <div class="floating-orbs absolute inset-0 pointer-events-none"></div>

    <!-- ─── Modern Glass Navbar ─── -->
    <nav class="glass fixed top-0 left-0 right-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <!-- Logo -->
            <a href="#" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg logo-float">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-900">Campus Bot</span>
            </a>

            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center space-x-10">
                <a href="/" class="nav-link text-gray-700 hover:text-blue-600 font-medium">Home</a>
               
            </div>

            <!-- Mobile Hamburger (you can add JS for toggle if needed) -->
            <button class="md:hidden text-gray-700 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Content (with top padding for fixed navbar) -->
    <div class="flex-1 flex items-center justify-center p-4 pt-24 md:pt-28">
        <div class="w-full max-w-md relative z-10">

            <!-- Logo and Title -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 shadow-2xl mb-5 logo-float transform-gpu mx-auto">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                    </svg>
                </div>
                <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight drop-shadow-md">Campus Bot</h1>
                <p class="text-lg text-gray-600 mt-2 font-medium">Your Smart College Companion</p>
            </div>

            <!-- College Selection Card -->
            <div class="glass rounded-3xl shadow-2xl p-10 border border-white/20 transform-gpu">
                <h2 class="text-2xl font-bold text-gray-800 mb-8 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 mr-3 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                    Choose Your College
                </h2>

                <form method="POST" action="/enter/" class="space-y-6">
                    {% csrf_token %}
                    
                    <div>
                        <label for="college_id" class="block text-base font-semibold text-gray-700 mb-3">Select Institution</label>
                        <select name="college_id" id="college_id" 
                                class="w-full px-5 py-4 border border-gray-300/60 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all bg-white/70 backdrop-blur-sm text-gray-800 text-lg shadow-inner">
                            {% for id, college in colleges.items %}
                                <option value="{{ id }}">{{ college.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" 
                            class="w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 text-white font-bold text-lg py-4 px-6 rounded-xl hover:from-blue-700 hover:via-indigo-700 hover:to-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all shadow-lg hover:shadow-xl btn-shine">
                        Enter Intelligent Chat →
                    </button>
                </form>
            </div>

            <!-- Features -->
            <div class="mt-8 text-center">
                <p class="text-sm text-gray-600 font-medium tracking-wide">
                    🔍 Real-time Campus Insights  •  💬 Telugu + English  •  ✨ AI Powered
                </p>
            </div>

        </div>
    </div>

</body>
</html>
